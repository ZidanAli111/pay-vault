server:
  port: ${SERVER_PORT}

spring:
  application: auth-service

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgressql.Driver

  jpa:
    hibernate:
      ddl-auto: auto
      show-sql: true
      database-platform: org.hibernate.dialect.PostgresSQLDialect


  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    timeout: 60000
  session:
    store-type: redis
    timeout: 1800s


  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}

  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID}
          client-secret: ${GOOGLE_CLIENT_SECRET}
