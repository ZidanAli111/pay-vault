spring.application.name=payvault
# Server Configuration
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/payvault
spring.datasource.username=postgres
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/payvault_db

# Redis Configuration (Message Queue)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.queue.name=eventQueue

# Circuit Breaker Configuration (Resilience4j)
resilience4j.circuitbreaker.instances.default.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50
resilience4j.circuitbreaker.instances.default.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.default.slowCallDurationThreshold=10s
resilience4j.circuitbreaker.instances.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=10s

# API Gateway Configuration
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates=Path=/user/**

# OpenAPI Swagger UI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator for Monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
