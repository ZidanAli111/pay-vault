server:
  port: 8080

spring:
  application:
    name: user-profile-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jDB_URL
    username: USER_NAME
    password: USER_PASSWORD

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
